<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("9Qlr97COTksQ3suqK"); // Replace with your EmailJS public key
    })();
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 40px;
    }
    form {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      font-weight: bold;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <h2 style="text-align: center;">Contact Us</h2>
  
  <form id="contact-form">
    <label for="name">Name</label>
    <input type="text" name="from_name" id="name" required>

    <label for="email">Email</label>
    <input type="email" name="reply_to" id="email" required>

    <label for="message">Message</label>
    <textarea name="message" id="message" rows="6" required></textarea>

    <button type="submit">Send Message</button>
  </form>

  <script>
    document.getElementById("contact-form").addEventListener("submit", function (e) {
      e.preventDefault();

      emailjs.sendForm("service_otp1csw", "template_1mewapl", this)
        .then(function () {
          alert("Message sent successfully!");
        }, function (error) {
          alert("Failed to send message: " + JSON.stringify(error));
        });
    });
  </script>

</body>
</html>
